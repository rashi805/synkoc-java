<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registrations | CampusConnect</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-background">
<header class="topbar"><div class="container" th:replace="~{fragments/navigation :: navigation}"></div></header>
<main class="container admin-main">
	<a class="back-link" th:href="@{/admin/events}">← Back to event overview</a>
	<div class="admin-heading"><div><p class="eyebrow eyebrow-dark">REGISTRATION ROSTER</p><h1 th:text="${event.title}">Event title</h1><p th:text="${#temporals.format(event.date, 'EEEE, MMMM d, yyyy')}">Date</p></div><span class="admin-count" th:text="${#lists.size(registrations)} + ' REGISTERED'">0 REGISTERED</span></div>
	<div class="table-wrap">
		<table th:if="${!#lists.isEmpty(registrations)}">
			<thead><tr><th>REGISTRATION #</th><th>STUDENT</th><th>EMAIL</th><th>COLLEGE</th><th>YEAR OF STUDY</th></tr></thead>
			<tbody><tr th:each="registration : ${registrations}">
				<td th:text="${registration.id}">100</td><td class="table-event" th:text="${registration.name}">Student</td>
				<td th:text="${registration.email}">student@example.edu</td><td th:text="${registration.college}">College</td><td th:text="${registration.yearOfStudy}">1</td>
			</tr></tbody>
		</table>
		<div class="table-empty" th:if="${#lists.isEmpty(registrations)}">Nobody has registered yet.</div>
	</div>
</main>
<footer class="footer"><div class="container footer-inner"><span>CampusConnect · Admin dashboard</span><a th:href="@{/events}">Student events</a></div></footer>
</body>
</html>
