<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Admin dashboard | CampusConnect</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-background">
<header class="topbar"><div class="container" th:replace="~{fragments/navigation :: navigation}"></div></header>
<main class="container admin-main">
	<div class="admin-heading"><div><p class="eyebrow eyebrow-dark">CAMPUSCONNECT / ADMIN</p><h1>Event overview</h1><p>Keep an eye on event attendance and student registrations.</p></div><span class="admin-count" th:text="${#lists.size(events)} + ' EVENTS'">4 EVENTS</span></div>
	<div class="table-wrap">
		<table>
			<thead><tr><th>EVENT</th><th>DATE</th><th>REGISTERED</th><th>CAPACITY</th><th></th></tr></thead>
			<tbody>
				<tr th:each="event : ${events}">
					<td class="table-event" th:text="${event.title}">Event title</td>
					<td th:text="${#temporals.format(event.date, 'MMM d, yyyy')}">Sep 15, 2025</td>
					<td><span class="registered-count" th:text="${event.registeredCount}">0</span> students</td>
					<td th:text="${event.capacity}">40</td>
					<td><a class="text-link" th:href="@{/admin/events/{id}/registrations(id=${event.id})}">View registrations ↗</a></td>
				</tr>
			</tbody>
		</table>
		<div class="table-empty" th:if="${#lists.isEmpty(events)}">No events have been added yet.</div>
	</div>
</main>
<footer class="footer"><div class="container footer-inner"><span>CampusConnect · Admin dashboard</span><a th:href="@{/events}">Student events</a></div></footer>
</body>
</html>
