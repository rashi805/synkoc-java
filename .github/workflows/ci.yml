name: CI

on:
  push:
  pull_request:

jobs:
  capstone:
    name: capstone
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone1/registration
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: capstone1/registration/pom.xml
      - name: Run tests
        run: ./mvnw -B test
