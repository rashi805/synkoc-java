name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  internship-courses:
    name: internship-courses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day09/campusevents
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: day09/campusevents/pom.xml
      - name: Run tests
        run: ./mvnw -B test
  day11-events:
