spring.application.name=campusevents
server.port=8080
synkoc.api.path=/api/courses
synkoc.api.sample={"title":"Mobile App Basics","fee":8999,"weeks":4,"level":"beginner"}
spring.datasource.url=jdbc:h2:file:./data/courses
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=Campus Events Courses API
info.app.environment=development
